// A plain JVM library on purpose: it reads file names and JSON and does
// arithmetic. Keeping Android out means the tests run in milliseconds and the
// measuring apparatus can be finished before there is a detector to measure.
plugins {
    alias(libs.plugins.kotlin.jvm)
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation libs.kotlin.stdlib.jdk7
    implementation libs.gson

    testImplementation libs.junit4
    testImplementation libs.truth
}

// The corpus lives outside the repository -- it is large, it never changes
// and it is not covered by the project's licence. Tests that need it skip
// themselves when the property is absent, so a fresh clone still builds
// green.
//
// rootProject.findProperty, not providers.gradleProperty: the root build
// script loads gradle-local.properties into the root project's ext, which
// the provider API does not see. rootProject.file, not file: the documented
// value is relative to the repository root, not to this module.
tasks.named('test') {
    def corpusDir = rootProject.findProperty('DETECTION_CORPUS_DIR')
    if (corpusDir != null) {
        systemProperty 'detection.corpus.dir',
            rootProject.file(corpusDir).absolutePath
    }
}
