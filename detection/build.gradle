plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.kotlin.android)
}

android {
    namespace = "de.dreier.mytargets.detection"
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig {
        minSdkVersion libs.versions.minSdk.get().toInteger()
        compileSdk libs.versions.compileSdk.get().toInteger()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles 'consumer-rules.pro'
    }

    // Must mirror the flavors of :shared, otherwise the dependency cannot be resolved.
    flavorDimensions "mode"
    productFlavors {
        dev { dimension "mode" }
        regular { dimension "mode" }
        screengrab { dimension "mode" }
    }

    // The catalog has no separate targetSdk entry; :app effectively uses compileSdk too.
    lint {
        targetSdk libs.versions.compileSdk.get().toInteger()
    }
    testOptions {
        targetSdk libs.versions.compileSdk.get().toInteger()
    }
}

dependencies {
    implementation libs.kotlin.stdlib.jdk7

    // The learned finder's model folder carries a JSON sidecar (design 3d,
    // Ablageformat); :app and :detection-corpus read JSON with Gson already.
    implementation libs.gson

    // The Java bindings of the desktop build. The app ships
    // org.opencv:opencv 4.14.0; compiling against 4.9 means an API that 4.9
    // lacks fails here rather than in a test (registration design,
    // "OpenCV-Version"). Only org.opencv.core and org.opencv.imgproc may be
    // imported: this jar has modules the Android AAR does not.
    compileOnly libs.opencv.desktop

    testImplementation libs.opencv.desktop
    testImplementation project(':detection-corpus')
    testImplementation libs.junit4
    testImplementation libs.truth

    // On the device the Android AAR provides OpenCV, dnn included. Used only
    // by the timing test of the learned finder (androidTest/README.md); the
    // app wires the same artifact in at integration.
    androidTestImplementation libs.opencv.android
    androidTestImplementation libs.junit4
    androidTestImplementation libs.truth
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.junit
}

// The corpus run and its report are wired into one variant only; otherwise
// ./gradlew test would measure the corpus in all six. Without DETECTION_CORPUS_DIR
// the tests that need it skip themselves. The learned finder's model folder
// (design 3d, Auffinden) always resolves, to the app's asset by default.
tasks.withType(Test).configureEach { task ->
    if (task.name == 'testDevDebugUnitTest') {
        def corpusDir = rootProject.findProperty('DETECTION_CORPUS_DIR')
        if (corpusDir != null) {
            task.systemProperty 'detection.corpus.dir',
                rootProject.file(corpusDir).absolutePath
        }
        // Without a local property the model the app ships is the one tested
        // (app integration 8a); a DETECTION_MODEL_DIR still wins, e.g. a new
        // export before it replaces the asset.
        def modelDir = rootProject.findProperty('DETECTION_MODEL_DIR') ?: 'app/src/main/assets/arrows/r4-all-2026-09'
        task.systemProperty 'detection.model.dir',
            rootProject.file(modelDir).absolutePath
        task.systemProperty 'detection.report.dir',
            layout.buildDirectory.dir('reports/detection').get().asFile.absolutePath
    }
}
